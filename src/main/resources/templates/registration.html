<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
</head>
<body class="m-5">
    <div th:replace="fragments/flash_message.html :: section"></div>

    <section>
        <form class="form-floating row g-3 align-items-center" method="post" action="#" data-th-action="@{/registration}" data-th-object="${user}">
            <div class="mb-3 col-auto">
                <input type="email" class="form-control" id="username" placeholder="Username" th:field="*{username}">
                <input type="text" class="form-control" id="email" placeholder="Email" th:field="*{email}">
                <input type="password" class="form-control" id="password" placeholder="Mot de passe" th:field="*{password}">
                <button class="btn btn-info col-auto" type="submit">S'inscrire</button>
            </div>
        </form>
    </section>

</body>
</html>
