<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
</head>
<body>
<div th:insert="fragments/header :: header"></div>
<section class="mx-5">
    <form class="row g-3" method="post" action="#" data-th-action="@{/transaction}" data-th-object="${transaction}">
        <input hidden="hidden" name="senderUser" th:field="*{senderUser}" value="${user.id}">
        <div class="col-md-4">
            <select class="form-select" name="relations" id="relations" th:field="*{receiverUser}">
                <option selected value="">Sélectionnez une relation</option>
                <option data-th-each="u : ${relations}" data-th-value="${u?.id}" data-th-text="${u?.getUsername()}"></option>
            </select>
        </div>
        <div class="col-md-4">
            <input class="form-control" name="Description" id="description" placeholder="description" aria-label="description" type="text" th:field="*{description}">
        </div>
        <div class="col-md-2">
            <div class="input-group">
                <input class="form-control" name="Montant" aria-label="montant" type="number" th:field="*{amount}" value="1">
                <span class="input-group-text" id="basic-addon2">€</span>
            </div>
        </div>
        <button class="btn btn-primary col-md-2" type="submit">Payer</button>
    </form>
</section>

<section class="m-5">
    <h2 class="fs-5">Mes transactions</h2>
    <div data-th-if="${transactions?.isEmpty()}">
        Aucune transaction en base de données
    </div>

    <table class="table" data-th-unless="${transactions.isEmpty()}">
        <thead>
            <tr>
                <th scope="col">Relations</th>
                <th scope="col">Description</th>
                <th scope="col">Montant</th>
            </tr>
        </thead>
        <tr data-th-each="t : ${transactions}">
            <td data-th-text="${t?.receiverUsername}"></td>
            <td data-th-text="${t?.description}"></td>
            <td data-th-text="${t?.amountCurrency}"></td>
        </tr>
    </table>
</section>

</body>
</html>
