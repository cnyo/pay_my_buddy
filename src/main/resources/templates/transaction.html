<!DOCTYPE html>
<html lang="fr" xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Transaction</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <link th:href="@{/css/custom.css}" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq"
            crossorigin="anonymous"></script>

</head>
<body>

<nav th:replace="~{fragments/nav :: nav}"></nav>
<section class="mx-5">
    <form class="row g-3" method="post" action="#" data-th-action="@{/transaction}" data-th-object="${form}">
        <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger">
            Veuillez corriger les erreurs dans le formulaire.
        </div>
        <div class="col-md-4">
            <label for="relations" class="visually-hidden">Relations</label>
            <select class="form-select" name="relations" id="relations" aria-required="true"
                    aria-label="Sélectionner une relation" aria-describedby="relationHelp" th:field="*{receiverUserId}">
                <option selected value="">Sélectionnez une relation</option>
                <option data-th-each="u : ${relations}" data-th-value="${u?.id}"
                        data-th-text="${u?.getUsername()}"></option>
            </select>
            <div class="text-bg-danger mt-1" id="relationHelp" th:if="${#fields.hasErrors('receiverUserId')}" th:errors="*{receiverUserId}"></div>
        </div>
        <div class="col-md-4">
            <label for="description" class="visually-hidden">Description</label>
            <input class="form-control" name="Description" id="description" placeholder="description"
                   aria-label="description" type="text" aria-describedby="descriptionHelp"  th:field="*{description}">
            <div class="text-bg-danger mt-1" id="descriptionHelp" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
        </div>
        <div class="col-md-2">
            <div class="input-group">
                <label for="montant" class="visually-hidden">Montant</label>
                <input class="form-control" id="montant" name="Montant" type="number" aria-label="Montant"
                       aria-required="true" aria-describedby="amountHelp"  th:field="*{amount}" value="1">
                <span class="input-group-text" id="basic-addon2">€</span>
            </div>
            <div class="text-bg-danger mt-1" id="amountHelp" th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}"></div>
        </div>
        <button class="btn btn-primary col-md-2" type="submit">Payer</button>
    </form>
</section>

<section class="m-5 p-3 border border-secondary-emphasis">
    <h2 class="fs-5">Mes transactions</h2>
    <div data-th-if="${transactions?.isEmpty()}">
        Aucune transaction en base de données
    </div>

    <table class="table" data-th-unless="${transactions.isEmpty()}">
        <thead>
        <tr>
            <th scope="col">Relations</th>
            <th scope="col">Description</th>
            <th scope="col" class="text-end">Montant</th>
        </tr>
        </thead>
        <tr data-th-each="t : ${transactions}">
            <td data-th-text="${t?.receiverUsername}"></td>
            <td data-th-text="${t?.description}"></td>
            <td class="text-end" data-th-text="${t?.amountCurrency}"></td>
        </tr>
    </table>
</section>
</body>
</html>
