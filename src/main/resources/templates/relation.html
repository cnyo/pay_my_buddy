<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
</head>
<body>
<div th:insert="fragments/nav :: header"></div>
<section class="m-5">
    <section>
        <form class="form-floating row g-3 align-items-center" method="post" action="#" data-th-action="@{/relation}" data-th-object="${user}">
            <div class="mb-3 col-auto">
                <label for="relation" class="form-label">Chercher une relation</label>
                <input type="email" class="form-control" id="relation" placeholder="Saisir une adresse email" th:field="*{email}">
            </div>
            <button class="btn btn-success col-auto" type="submit">Ajouter</button>
        </form>
    </section>
</section>

</body>
</html>
