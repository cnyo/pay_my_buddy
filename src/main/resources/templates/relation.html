<!DOCTYPE html>
<html lang="fr" xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Relations</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <link href="custom.css" th:href="@{css/custom.css}" rel="stylesheet" media="screen"/>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq"
            crossorigin="anonymous"></script>

</head>
<body>
<div th:replace="fragments/nav :: nav"></div>
<section>
    <form class="w-25 mx-auto" method="post" action="#" data-th-action="@{/relation}" data-th-object="${user}">
        <div th:replace="~{fragments/_flash_message}"></div>
        <div class="form-group row d-flex align-items-end">
            <div class="col-8">
                <label for="relation" class="form-label">Chercher une relation</label>
                <input type="email" class="form-control" id="relation" placeholder="Saisir une adresse email"
                       aria-label="Rechercher une relation" aria-required="true" th:field="*{email}">
            </div>
            <div class="col-4">
                <button class="btn btn-warning text-dark col-auto" type="submit">Ajouter</button>
            </div>
        </div>
    </form>
</section>
</body>
</html>
