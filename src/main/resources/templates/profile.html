<!DOCTYPE html>
<html lang="fr" xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Profile</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <link href="custom.css" th:href="@{css/custom.css}" rel="stylesheet" media="screen"/>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq"
            crossorigin="anonymous"></script>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>
<section>
    <form class="w-25 mx-auto" method="post" action="#" th:action="@{/profile}" th:object="${form}">
        <div th:replace="~{fragments/_flash_message}"></div>
        <div class="mb-3 row">
            <label for="username" class="col-sm-2 col-form-label">Username</label>
            <div class="col-sm-10">
                <input type="text" class="form-control" id="username" value="username" aria-label="Username"
                       aria-required="true" th:field="*{username}">
            </div>
        </div>
        <div class="mb-3 row">
            <label for="email" class="col-sm-2 col-form-label">Email</label>
            <div class="col-sm-10">
                <input type="email" class="form-control" id="email" value="email@example.com" aria-label="Email"
                       aria-required="true" th:field="*{email}">
            </div>
        </div>
        <div class="mb-3 row">
            <label for="password" class="col-sm-2 col-form-label">Password</label>
            <div class="col-sm-10">
                <input type="password" class="form-control" id="password" aria-label="Password" th:field="*{password}" aria-required="true">
            </div>
        </div>
        <div class="">
            <button class="btn btn-warning text-dark float-end" type="submit">Modifier</button>
        </div>
    </form>
</section>
</body>
</html>
